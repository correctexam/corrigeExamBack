services:
  correctexam-mysql:
    image: mysql:8.0.20
    volumes:
      - ./../resources/db/migration/:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_USER=root
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=correctexam
    command: mysqld --lower_case_table_names=1 --skip-ssl --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    ports:
      - 3308:3306

  myadmin:
    image: phpmyadmin
    container_name: myadmin
    environment:
      -  PMA_HOST=correctexam-mysql
    ports:
      - 8085:80
  maildev:
    image: maildev/maildev
    container_name: maildev
    command: bin/maildev --base-pathname /maildev -w 1080 -s 1025
    ports:
      - 1080:1080
      - 1025:1025

  miniocorrectexam:
    image: minio/minio
    container_name: miniocorrectexam
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-files:/data:rw
    restart: always
    ports:
      - 9000:9000
      - 9090:9090
    command: server /data --console-address ":9090"

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"  # RabbitMQ port
      - "15672:15672"  # RabbitMQ management port
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always

    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq


  pdf_to_webp:
    image: barais/pdf_to_webp
    command: ["./pdf_to_webp", "--mq","--mq-server-host","rabbitmq","--server-url","http://miniocorrectexam:9000"]
    restart: always

  kroki:
    image: yuzutech/kroki:${KROKI_VERSION:-latest} # pin the version in production
    environment:
      - KROKI_SAFE_MODE=secure
      - KROKI_MERMAID_HOST=kroki-mermaid
      - KROKI_MAX_URI_LENGTH=8192
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      - kroki-mermaid
    restart: unless-stopped
  kroki-mermaid:
    image: yuzutech/kroki-mermaid:${KROKI_VERSION:-latest}
    expose:
      - 8002
    restart: unless-stopped

volumes:
  rabbitmq-data:
    driver: local
  mysql-data:
    driver: local
  minio-files:
    driver: local



