# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'mandrel'
        native-image-musl: 'false'
    - name: Build with Maven
      run: mvn clean package -Pnative -DskipTests -Dquarkus.native.container-build=true
    - name: Check the CPU level required by the native binary
      # The server CPU stops at x86-64-v2: fail before pushing an image it cannot run
      run: |
        readelf -n target/*-runner | grep -i "ISA needed" || true
        if readelf -n target/*-runner | grep -qE "x86-64-v3|x86-64-v4"; then
          echo "::error::The native binary requires x86-64-v3 or more; the server supports x86-64-v2 only"
          exit 1
        fi
#      run: mvn clean compile package -Pnative -DskipTests
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./
        file: ./src/main/docker/Dockerfile.native
        push: true
        tags: barais/grade-scope-istic:develop
